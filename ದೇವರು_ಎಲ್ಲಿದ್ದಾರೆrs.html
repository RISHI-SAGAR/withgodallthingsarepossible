<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ದೇವರು ಎಲ್ಲಿದ್ದಾರೆ?</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Kannada&family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8770A;
    --deep-saffron: #C85A00;
    --gold: #D4A017;
    --gold-light: #F5D060;
    --cream: #FDF6E3;
    --dark-bg: #1A0A00;
    --card-bg: #2D1200;
    --text-light: #FFF8E7;
    --text-muted: #C9A97A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--dark-bg);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(232,119,10,0.13) 0%, transparent 60%);
    color: var(--text-light);
    font-family: 'Tiro Kannada', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    padding: 52px 20px 36px;
    border-bottom: 1px solid rgba(212,160,23,0.25);
  }

  .bindi-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFD700, #E8770A);
    margin: 0 auto 10px;
    box-shadow: 0 0 18px rgba(232,119,10,0.9), 0 0 40px rgba(212,160,23,0.5);
    animation: bindi-pulse 2.5s ease-in-out infinite;
  }

  @keyframes bindi-pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(232,119,10,0.9), 0 0 40px rgba(212,160,23,0.5); transform: scale(1); }
    50%       { box-shadow: 0 0 28px rgba(255,180,0,1),   0 0 60px rgba(232,119,10,0.7); transform: scale(1.12); }
  }

  .ashraya-text {
    font-family: 'Tiro Kannada', serif;
    font-size: 1rem;
    color: var(--text-muted);
    letter-spacing: 0.18em;
    margin-bottom: 18px;
    opacity: 0.85;
  }

  header h1 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(1.2rem, 3vw, 1.9rem);
    color: var(--gold-light);
    letter-spacing: 0.05em;
    line-height: 1.35;
  }

  header .subtitle {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin-top: 10px;
    font-style: italic;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 22px;
    color: var(--gold);
    font-size: 0.8rem;
    opacity: 0.55;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    max-width: 110px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ===== INSTRUCTION ===== */
  .instruction {
    text-align: center;
    padding: 22px 20px 6px;
    color: var(--text-muted);
    font-size: 0.92rem;
  }
  .instruction span {
    background: rgba(212,160,23,0.1);
    border: 1px solid rgba(212,160,23,0.22);
    padding: 6px 22px;
    border-radius: 30px;
    display: inline-block;
  }

  /* ===== GRID ===== */
  .saints-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 32px 24px;
    max-width: 1080px;
    margin: 38px auto 80px;
    padding: 0 28px;
  }

  /* ===== SAINT CARD ===== */
  .saint-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    animation: fadeInUp 0.55s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .photo-ring {
    width: 144px;
    height: 144px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #D4A017, #E8770A, #F5D060, #C85A00, #D4A017);
    box-shadow: 0 0 16px rgba(212,160,23,0.35);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .saint-card:hover .photo-ring {
    box-shadow: 0 0 34px rgba(232,119,10,0.8), 0 0 55px rgba(212,160,23,0.4);
    transform: scale(1.06) translateY(-3px);
  }

  .photo-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #2D1200;
    border: 3px solid #1A0A00;
  }

  .photo-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
    transition: transform 0.35s ease;
  }

  .saint-card:hover .photo-inner img { transform: scale(1.08); }

  .photo-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #3D1A00, #1A0800);
    font-size: 2.6rem;
  }

  .lotus-dot {
    width: 7px;
    height: 7px;
    background: var(--gold);
    border-radius: 50%;
    margin: 10px auto 5px;
    box-shadow: 0 0 7px rgba(212,160,23,0.8);
    position: relative;
  }
  .lotus-dot::before {
    content: '';
    position: absolute;
    top: 3px; left: -8px;
    width: 22px; height: 1px;
    background: rgba(212,160,23,0.35);
  }

  .saint-name {
    font-size: 0.98rem;
    color: var(--gold-light);
    text-align: center;
    line-height: 1.45;
    transition: color 0.2s;
  }
  .saint-card:hover .saint-name { color: #fff; }

  /* ===== MODAL ===== */
  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 3, 0, 0.87);
    backdrop-filter: blur(7px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #modalOverlay.open { display: flex; }

  .modal-box {
    background: linear-gradient(155deg, #2C1100 0%, #1A0800 55%, #231000 100%);
    border: 1px solid rgba(212,160,23,0.42);
    border-radius: 20px;
    max-width: 660px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 50px 44px 40px;
    position: relative;
    box-shadow: 0 0 70px rgba(232,119,10,0.22), 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(212,160,23,0.18);
    animation: modalIn 0.32s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes modalIn {
    from { transform: translateY(36px) scale(0.95); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-box::-webkit-scrollbar { width: 5px; }
  .modal-box::-webkit-scrollbar-track { background: transparent; }
  .modal-box::-webkit-scrollbar-thumb { background: rgba(212,160,23,0.35); border-radius: 5px; }

  .modal-close {
    position: absolute;
    top: 15px; right: 18px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.2s, transform 0.25s;
    line-height: 1;
    padding: 4px 8px;
  }
  .modal-close:hover { color: var(--gold-light); transform: rotate(90deg); }

  .modal-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }

  .modal-photo-ring {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, #D4A017, #E8770A, #F5D060, #C85A00, #D4A017);
    box-shadow: 0 0 28px rgba(232,119,10,0.65);
    margin-bottom: 14px;
  }
  .modal-photo-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #1A0800;
    background: #2D1200;
  }
  .modal-photo-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .modal-name-en {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 1.2rem;
    color: var(--gold-light);
    text-align: center;
    margin-bottom: 4px;
  }
  .modal-name-kn {
    font-size: 1.05rem;
    color: var(--text-muted);
    text-align: center;
  }
  .modal-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,160,23,0.45), transparent);
    margin: 26px 0;
  }

  .verse-block {
    background: rgba(255,255,255,0.025);
    border-left: 3px solid var(--saffron);
    border-radius: 0 10px 10px 0;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .verse-label {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 0.62rem;
    color: var(--saffron);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.85;
  }
  .verse-text {
    font-size: 1.06rem;
    line-height: 2.05;
    color: var(--cream);
  }

  .modal-tail {
    text-align: center;
    color: rgba(201,169,122,0.45);
    font-size: 0.8rem;
    margin-top: 28px;
    letter-spacing: 0.06em;
  }

  footer {
    text-align: center;
    padding: 22px;
    border-top: 1px solid rgba(212,160,23,0.13);
    color: rgba(201,169,122,0.35);
    font-size: 0.78rem;
    letter-spacing: 0.07em;
  }

  @media (max-width: 600px) {
    .saints-grid { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; padding: 0 14px; }
    .modal-box { padding: 38px 20px 32px; }
    .photo-ring { width: 116px; height: 116px; }
  }
</style>
</head>
<body>

<header>
  <div class="bindi-dot"></div>
  <p class="ashraya-text">ಅದಿಯೇ ಆಶ್ರಯ</p>
  <h1>ದೇವರು ಎಲ್ಲಿದ್ದಾರೆ?</h1>
  <p class="subtitle">ನಾವು ಆರಾಧಿಸುವ ಜ್ಞಾನಿಗಳ ದೃಷ್ಟಿಯಲ್ಲಿ</p>
  <div class="divider">✦ ✦ ✦</div>
</header>

<p class="instruction"><span>📿 ಫೋಟೋ ಮೇಲೆ ಕ್ಲಿಕ್ ಮಾಡಿ — ಅವರ ವಚನ / ನುಡಿ ಓದಿ</span></p>

<div class="saints-grid" id="saintsGrid"></div>

<div id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" id="closeBtn">✕</button>
    <div class="modal-header">
      <div class="modal-photo-ring">
        <div class="modal-photo-inner" id="modalPhotoInner">
          <img id="modalImg" src="" alt="">
        </div>
      </div>
      <div class="modal-name-en" id="modalNameEn"></div>
      <div class="modal-name-kn" id="modalNameKn"></div>
    </div>
    <div class="modal-rule"></div>
    <div id="modalVerses"></div>
    <div class="modal-tail">🪔 ದೇವರು ಒಳಗಿದ್ದಾನೆ — ಹೊರಗೆ ಹುಡುಕಬೇಡ 🪔</div>
  </div>
</div>

<footer>ಸರ್ವೇ ಭವಂತು ಸುಖಿನಃ · ಸರ್ವೇ ಸಂತು ನಿರಾಮಯಾಃ</footer>

    verses: [
      { label: "ನುಡಿ ೧", lines: ["ದೇವರಿಲ್ಲ ಎಂದವರು ಮೂರ್ಖರು;","ದೇವರು ಎಲ್ಲೋ ದೂರದಲ್ಲಿದ್ದಾರೆ ಎಂದವರೂ ಮೂರ್ಖರು —","ದೇವರು ಪ್ರತಿ ಜೀವದ ಒಳಗೇ ಇದ್ದಾರೆ,","ಕಾಣದಿರುವುದು ನಮ್ಮ ಮಾಯೆಯ ತೆರೆ ಮಾತ್ರ."] },
      { label: "ನುಡಿ ೨", lines: ["ಮಣ್ಣಿನಿಂದ ಮಾಡಿದ ಎಲ್ಲ ಮಡಿಕೆಗಳಲ್ಲೂ ಮಣ್ಣಿದೆ,","ಹಾಗೆಯೇ ಈ ಸೃಷ್ಟಿಯಲ್ಲಿನ ಪ್ರತಿಯೊಂದರಲ್ಲೂ","ಭಗವಂತನ ಸ್ಪರ್ಶವಿದೆ —","ಅವನನ್ನು ಕಾಣಲು ಶುದ್ಧ ಮನಸ್ಸೊಂದೇ ಸಾಕು."] },
      { label: "ನುಡಿ ೩", lines: ["ನೀರು ಒಂದೇ ಆದರೂ","ಹಲವು ಪಾತ್ರೆಗಳಲ್ಲಿ ಹಲವು ಆಕಾರ ತಳೆಯುವಂತೆ,","ದೇವರು ಒಬ್ಬನೇ ಆದರೂ","ಶಿವ, ಕಾಳಿ, ಅಲ್ಲಾ, ಕ್ರಿಸ್ತ ಎಂದು ಕರೆಸಿಕೊಳ್ಳುತ್ತಾನೆ."] }

    verses: [
      { label: "ನುಡಿ ೧", lines: ["ದೇಹದ ಒಳಗೇ ಪರಮಾತ್ಮ ನೆಲೆಸಿದ್ದಾನೆ,","ಹೊರಗೆ ಅಲೆಯುವ ಮನವನ್ನು ಒಳಗೆ ತಿರುಗಿಸು —","ಆಗ ತಾನಾಗಿಯೇ ಸತ್ಯ ದರ್ಶನವಾಗುವುದು."] },
      { label: "ನುಡಿ ೨", lines: ["ಭಜನೆ, ಪೂಜೆ, ತೀರ್ಥಯಾತ್ರೆ ಇವೆಲ್ಲ","ಮನಸ್ಸನ್ನು ಶುದ್ಧ ಮಾಡುವ ಸಾಧನಗಳು —","ಆ ಶುದ್ಧ ಮನಸ್ಸಿನ ಕನ್ನಡಿಯಲ್ಲಿ","ಭಗವಂತ ತನ್ನಿಂದ ತಾನೇ ಮೂಡಿ ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತಾನೆ."] },
      { label: "ನುಡಿ ೩", lines: ["ಜೀವ ಎಂಬ ದೀಪ ಶಿವ ಎಂಬ ಎಣ್ಣೆಯಿಂದ ಉರಿಯುತ್ತಿದೆ —","ಆ ಬೆಳಕನ್ನೇ ಗುರುತಿಸಿದವನಿಗೆ","ಬೇರೆ ದೇವಾಲಯ ಅರಸುವ ಅವಶ್ಯಕತೆಯಿಲ್ಲ."] }

// ---- Build Grid ----
var grid = document.getElementById('saintsGrid');

saints.forEach(function(s, i) {
  var card = document.createElement('div');
  card.className = 'saint-card';
  card.style.animationDelay = (i * 0.06) + 's';

  var ring = document.createElement('div');
  ring.className = 'photo-ring';
  var inner = document.createElement('div');
  inner.className = 'photo-inner';

  var imgEl = new Image();
  imgEl.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top center;display:block;opacity:0;transition:opacity 0.6s';
  imgEl.onload = function() { setTimeout(function(){ imgEl.style.opacity='1'; }, 30); };
  imgEl.onerror = function() { inner.innerHTML = '<div class="photo-fallback">' + s.emoji + '</div>'; };
  imgEl.src = s.img;
  s._resolvedImg = s.img;
  inner.appendChild(imgEl);
  ring.appendChild(inner);

  var dot = document.createElement('div');
  dot.className = 'lotus-dot';

  var nm = document.createElement('div');
  nm.className = 'saint-name';
  nm.textContent = s.nameKn;

  card.appendChild(ring);
  card.appendChild(dot);
  card.appendChild(nm);

  (function(idx) {
    card.addEventListener('click', function() { openModal(idx); });
  })(i);

  grid.appendChild(card);
});

// ---- Modal ----
var overlay    = document.getElementById('modalOverlay');
var modalImg   = document.getElementById('modalImg');
var mPhotoIn   = document.getElementById('modalPhotoInner');
var mNameEn    = document.getElementById('modalNameEn');
var mNameKn    = document.getElementById('modalNameKn');
var mVerses    = document.getElementById('modalVerses');

function openModal(idx) {
  var s = saints[idx];

  mPhotoIn.innerHTML = '';
  var img = new Image();
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top center;opacity:0;transition:opacity 0.5s';
  img.onload = function() { setTimeout(function(){ img.style.opacity='1'; }, 30); };
  img.onerror = function() { mPhotoIn.innerHTML = '<div class="photo-fallback">' + s.emoji + '</div>'; };
  img.src = s.img;
  mPhotoIn.appendChild(img);

  mNameEn.textContent = s.nameEn;
  mNameKn.textContent = s.nameKn;

  var html = '';
  for (var v = 0; v < s.verses.length; v++) {
    html += '<div class="verse-block">';
    html += '<div class="verse-label">' + s.verses[v].label + '</div>';
    html += '<div class="verse-text">' + s.verses[v].lines.join('<br>') + '</div>';
    html += '</div>';
  }
  mVerses.innerHTML = html;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', function(e) {
  if (e.target === overlay) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});
</script>
